; Seeed Studio XIAO ESP32C5 with the Wio-SX1262 for XIAO expansion module.
; LoRa pins are the ones the module wires to the XIAO pads:
;   NSS=D4, DIO1=D1, BUSY=D3, RESET=D2, RXEN=D5, SCK=D8, MISO=D9, MOSI=D10
; which on the C5 map to the GPIO numbers below. D4/D5 are the default I2C pads,
; so I2C is moved to D6/D7 (GPIO11/GPIO12) like on the Xiao C6.
[Xiao_C5]
extends = esp32c5_base
board = esp32-c5-devkitc1-n8r4
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32c5_base.build_flags}
  -I variants/xiao_c5
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_TX_LED=27
  -D P_LORA_SCLK=8
  -D P_LORA_MISO=9
  -D P_LORA_MOSI=10
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=0
  -D P_LORA_BUSY=7
  -D P_LORA_RESET=25
  -D PIN_BOARD_SDA=11
  -D PIN_BOARD_SCL=12
  -D SX126X_RXEN=24
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c5_base.build_src_filter}
  +<../variants/xiao_c5>
  +<XiaoC5Board.cpp>

[env:Xiao_C5_repeater]
extends = Xiao_C5
build_src_filter = ${Xiao_C5.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Xiao_C5.build_flags}
  -D ADVERT_NAME='"Xiao C5 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Xiao_C5.lib_deps}
  ${esp32_ota.lib_deps}

[env:Xiao_C5_companion_radio_ble]
extends = Xiao_C5
build_flags = ${Xiao_C5.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
;  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${Xiao_C5.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Xiao_C5.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_C5_companion_radio_usb]
extends = Xiao_C5
build_flags = ${Xiao_C5.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_C5.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Xiao_C5.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_C5_kiss_modem]
extends = Xiao_C5
build_src_filter = ${Xiao_C5.build_src_filter}
  +<../examples/kiss_modem/>
